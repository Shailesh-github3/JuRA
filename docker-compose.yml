# ---------------------------------------------------------------------------
# JuRA local infrastructure.
#
#   docker compose up -d      # start Qdrant + PostgreSQL
#   docker compose ps         # check health
#   docker compose down       # stop (data survives in the named volumes)
#   docker compose down -v    # stop AND delete all vectors/database rows
#
# These two services are the ONLY external dependencies of the repo:
#   - Qdrant     : vector store for python-ai-engine (app/vectorstore/qdrant_service.py)
#   - PostgreSQL : relational store for the Spring Boot backend (Flyway migrations)
#
# Credentials below match backend/src/main/resources/application.yml defaults
# (jdbc:postgresql://localhost:5432/jura_db, postgres/postgres), so the backend
# boots with no environment variables set.
#
# NOTE ON VOLUME NAMES: Compose prefixes every volume with the project name
# (the repo directory name, lowercased). `qdrant_storage` therefore becomes
# `jura_qdrant_storage` and `pgdata` becomes `jura_pgdata`, which are exactly
# the volumes the manual `docker run` commands used -- so switching from those
# commands to this file keeps the already-ingested vectors.
# ---------------------------------------------------------------------------

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jura-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships bash but neither curl nor wget, so probe the
      # REST port with bash's /dev/tcp instead of an HTTP client.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: jura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jura_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jura_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
  pgdata:
